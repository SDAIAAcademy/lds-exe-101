<h2>اليوم 1: جرّب بيدك، وراقب الوكيل، ثم اسأل</h2>
<ol>
<li><p>في ملخص لجنة التدريب: «رفعت برامج مماثلة في أمانات أخرى الإنتاجية 30%». المحضر لا يذكر ذلك، وأنت تتذكر تقريرًا بهذا المعنى. بماذا تصنفها؟</p><ul><li><b>أ.</b> مؤكد، فأنا أتذكر تقريرًا بالمعنى نفسه</li><li><b>ب.</b> غير قابل للتحقق حتى يُفتح مصدره</li><li><b>ج.</b> خاطئ، فالمحضر لا يذكرها</li><li><b>د.</b> مؤكد، فالرقم محدد ولا يبدو مختلقًا</li></ul></li>
<li><p>وكيل كُلّف بإرسال تقرير الربع إلى عشرين مديرًا. السجل: أعدّ التقرير، وأرسله إلى اثني عشر، ثم توقف عند خطأ في القائمة. رسالته الختامية: «تمت المهمة». كيف تسجّل هذا التشغيل؟</p><ul><li><b>أ.</b> ناجح، فالرسالة الختامية تؤكد ذلك</li><li><b>ب.</b> ناجح بنسبة 60%، فأغلب التقارير وصلت</li><li><b>ج.</b> مخفق كله</li><li><b>د.</b> جزئي، مع ادعاء إنجاز كاذب</li></ul></li>
<li><p>فريق يقترح مساعدًا يجيب عن استفسارات المراجعين في مركز خدمة. أي هذه الادعاءات أقرب صلة بقرار التشغيل؟</p><ul><li><b>أ.</b> تستخدمه 40 جهة حكومية في المنطقة</li><li><b>ب.</b> وفّر الموظفون نصف وقتهم بحسب استبانة</li><li><b>ج.</b> أخطأ في 6 من 200 استفسار من سجلنا</li><li><b>د.</b> حلّ نموذجه الأول في لوحة صدارة للغة العربية</li></ul></li>
<li><p>مساعد كتب لك إحاطة عن مشروع، وفيها: «بلغت نسبة الإنجاز 64% بنهاية الربع». تقرير المشروع المرفق يقول 46%. كيف تصنف الجملة؟</p><ul><li><b>أ.</b> غير قابلة للتحقق، فالتقرير قد يكون قديمًا</li><li><b>ب.</b> خاطئة، فالمصدر المرفق يناقضها</li><li><b>ج.</b> مؤكدة، فالأرجح أن الفرق خطأ مطبعي لا يغيّر المعنى</li><li><b>د.</b> صحيحة إن أكدها المساعد حين تسأله ثانية</li></ul></li>
<li><p>في ورقة ادعاءات لإحاطة مرفوعة للمجلس وجدت أربعة أخطاء. أيها تعلّمه «يصل إلى قرار»؟</p><ul><li><b>أ.</b> تاريخ الاجتماع السابق مكتوب بيوم خاطئ</li><li><b>ب.</b> اسم الإدارة باختصاره القديم</li><li><b>ج.</b> رقم الصفحة في الإحالة إلى المرفق خاطئ</li><li><b>د.</b> تكلفة البديل المقترح مضاعفة خطأً</li></ul></li>
<li><p>تريد أن تلخص بمساعد مستضاف عرض أسعار تلقته جهتك من مورد ولم يُعلن بعد. ما الصواب بحسب المبادئ الوطنية للجهات الحكومية؟</p><ul><li><b>أ.</b> أدخله بعد حذف اسم المورد وأرقام التواصل</li><li><b>ب.</b> لا تدخله: هو غير منشور، وتصنيفه فوق «عام»</li><li><b>ج.</b> أدخله إن كان المساعد باشتراك مدفوع من جهتك</li><li><b>د.</b> أدخله واطلب ألا تُحفظ المحادثة</li></ul></li>
<li><p>أنهى المساعد ملخصه بعبارة: «المصدر: تقرير الهيئة السنوي 2025، صفحة 14». ما الذي تفعله قبل أن تصنف الجملة المنسوبة إليه «مؤكدة»؟</p><ul><li><b>أ.</b> أفتح التقرير في الصفحة وأقرأ الرقم بنفسي</li><li><b>ب.</b> أقبلها، فذكر رقم الصفحة يدل على أنه قرأها</li><li><b>ج.</b> أطلب منه أن يقتبس النص الذي استند إليه من الصفحة</li><li><b>د.</b> أبحث عن العنوان لأتأكد أن التقرير موجود فعلًا</li></ul></li>
<li><p>قارنت نسختك من إحاطة بنسخة المساعد. نسختك ذكرت منطقتين لم تحققا المستهدف، ونسخته ذكرت واحدة، وكل ادعاءاته الأخرى مؤكدة. ماذا تكتب في المقارنة؟</p><ul><li><b>أ.</b> نسخته أدق، لأن كل ادعاءاته مؤكدة بالمصادر</li><li><b>ب.</b> النسختان متساويتان ما دامت ادعاءاته كلها مؤكدة</li><li><b>ج.</b> نسخته أغفلت منطقة، والإغفال يصل إلى قرار</li><li><b>د.</b> نسختي أخطأت بذكر منطقة زائدة على المطلوب</li></ul></li>
<li><p>مورد يقول إن وكيله حصل على «درجة 39%» في اختبار مرجعي لمهام مكتبية. ما أول ما تسأل عنه؟</p><ul><li><b>أ.</b> هل هي نسبة المهام المكتملة، أم درجة تحتسب الجزئي؟</li><li><b>ب.</b> ما ترتيبه بين النماذج على الاختبار نفسه؟</li><li><b>ج.</b> هل الدرجة أعلى من درجة العام الماضي على الاختبار المرجعي نفسه؟</li><li><b>د.</b> هل يستخدم المورد أحدث نموذج متاح؟</li></ul></li>
<li><p>أبهركم وكيل في عرض وهو يصلح كودًا خلال دقائق. يقترح الفريق أن يتولى الوكيل نفسه إعداد التسويات المالية الشهرية. ما الحكم الأقرب للأدلة؟</p><ul><li><b>أ.</b> نجاحه في الكود يكفي، فالتسويات أبسط من البرمجة</li><li><b>ب.</b> لا يُستخدم الوكيل في المال</li><li><b>ج.</b> يُجرَّب على تسويات من عملنا قبل أي قرار</li><li><b>د.</b> يُعتمد إن قدّم المورد ضمانًا مكتوبًا بالأداء والدقة</li></ul></li>
<li><p>في سجل وكيل أعدّ تقرير مبيعات: فتح ملف الفروع الشمالية والجنوبية، ولم يفتح ملف الفروع الشرقية، ثم حسب المجموع بدقة. ما نوع الإخفاق الأول؟</p><ul><li><b>أ.</b> ادعاء إنجاز كاذب</li><li><b>ب.</b> بيانات ناقصة</li><li><b>ج.</b> مصدر قديم أو خاطئ</li><li><b>د.</b> رقم على أساس خاطئ</li></ul></li>
<li><p>نجح وكيل في إعداد مذكرة أكتوبر خمس مرات متتالية. يريد الفريق تشغيله آليًّا على كل الأشهر والمناطق. ما الذي يجب أن تتحقق منه أولًا؟</p><ul><li><b>أ.</b> أن رسالته الختامية تؤكد النجاح</li><li><b>ب.</b> أن المذكرات الخمس متطابقة في صياغتها وأرقامها</li><li><b>ج.</b> أن المذكرة تصل إلى نائبة المحافظ في وقتها المحدد</li><li><b>د.</b> أنه يمر بالخطوات نفسها على شهر آخر</li></ul></li>
<li><p>قرأت أن أفضل نموذج ينجز في نصف المحاولات مهام برمجية تستغرق من الخبير نحو 50 دقيقة. ما الاستنتاج الذي تسنده هذه النتيجة؟</p><ul><li><b>أ.</b> سينجز كل مهامنا التي تستغرق أقل من ساعة</li><li><b>ب.</b> قرابة نصف محاولاته تخفق في مهام بهذا الطول</li><li><b>ج.</b> يمكن الاعتماد عليه في المهام الإدارية بالطول نفسه</li><li><b>د.</b> لا يُعتمد عليه في أي مهمة تتجاوز ساعة من وقت الخبير</li></ul></li>
<li><p>تقرير تجربة داخلية يقول: «أفاد 85% من الموظفين بأن المساعد وفّر وقتهم». ما الذي يجعل هذا الرقم ضعيف الصلة بقرار التوسع؟</p><ul><li><b>أ.</b> أنه شعور يبلّغ عنه المستخدمون، لا وقت مقيس</li><li><b>ب.</b> أن النسبة أعلى مما يُصدَّق في تجربة داخلية قصيرة</li><li><b>ج.</b> أن الموظفين لا يعرفون مصلحة جهتهم في قرار التوسع</li><li><b>د.</b> أن التجربة كانت داخلية لا يجريها طرف خارجي محايد</li></ul></li>
<li><p>مقالة تقول إن 78% من المؤسسات تستخدم الذكاء الاصطناعي، ومسح رسمي يقول 5.4% من الشركات. ما الموقف الأدق من الفرق؟</p><ul><li><b>أ.</b> أحد الرقمين خاطئ بالضرورة، فلا يصح الاثنان معًا</li><li><b>ب.</b> الرقم الأحدث هو الأصح، فالاستخدام يتغير بسرعة</li><li><b>ج.</b> لا أقارنهما قبل معرفة مقام كل منهما وتعريفه</li><li><b>د.</b> المسح الرسمي أصح دائمًا لأن جهة حكومية أجرته</li></ul></li>
<li><p>وكيل تكلفة محاولته 2 ريال، ويكمل 25% من المهام. كم تكلفته لكل مهمة مكتملة قبل احتساب من يكمل الباقي؟</p><ul><li><b>أ.</b> 0.5 ريال</li><li><b>ب.</b> 2 ريال</li><li><b>ج.</b> 2.25 ريال</li><li><b>د.</b> 8 ريالات</li></ul></li>
<li><p>كتبت عن مقترح نظام لفرز البلاغات ثمانية أسئلة: خمسة عن الدقة، وثلاثة عن التكلفة. ما أهم ما ينقص قائمتك؟</p><ul><li><b>أ.</b> أسئلة أكثر عن الدقة بأرقام وحالات مختلفة</li><li><b>ب.</b> أسئلة عن البيانات والإشراف والمالك الغائبة كلها</li><li><b>ج.</b> اسم النموذج الذي بُني عليه النظام وإصداره</li><li><b>د.</b> سؤال عن موعد إطلاق النسخة التالية من المنتج</li></ul></li>
<li><p>يقترح فريق أن يرد نظام ذكاء اصطناعي طلبات الإعانة غير المكتملة آليًّا، دون إشعار مقدم الطلب بالسبب. ما أقوى اعتراض؟</p><ul><li><b>أ.</b> لا يعرف المتضرر بالخطأ، فلا يستطيع أن يعترض عليه</li><li><b>ب.</b> التكلفة قد تكون أعلى من تكلفة المراجعة البشرية</li><li><b>ج.</b> قد يبطؤ في أوقات الذروة فتتأخر الردود على المتقدمين</li><li><b>د.</b> النموذج قد لا يفهم اللهجات المحلية في الطلبات</li></ul></li>
</ol>
